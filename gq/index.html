<div class="wrap">
  <nav class="appnav" aria-label="내 사이트 이동"><a href="../">🏠 JO</a><a href="https://claude.ai/artifact/RZMUXQAtFXWBg2fBPKP5ye">📅 JO Calendar</a><span aria-current="page">📚 국시 퀘스트</span><a href="https://claude.ai/artifact/DDSmnRbtg8X6MHBCGs1o1W">🔤 토익 데일리</a></nav>

  </header>

  <main id="view" class="wrap"></main>

<script>
"use strict";
/* ============ 기본 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => fmt(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const md = s => s ? (+s.slice(5, 7)) + "/" + (+s.slice(8, 10)) : "";
const EXAM = "2026-12-13", INTERVALS = [1, 3, 7, 14, 30];
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* 설정: 이 기기에만 저장 (Gemini 키·Firebase 설정값은 GitHub에 올라가지 않는다) */
const CFG_K = "gqw.cfg";
let cfg = Object.assign({ geminiKey: "", model: "gemini-2.5-flash", firebase: "" }, lsGet(CFG_K, {}));
const saveCfg = () => lsSet(CFG_K, cfg);
/* 설정 링크: …/gq/#fb=<Firebase 설정값> 으로 열면 자동으로 채운다(# 뒤는 서버로 안 감) */
(function () { const m = location.hash.match(/^#fb=(.+)$/); if (!m) return; try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); if (o.apiKey && o.projectId) { cfg.firebase = JSON.stringify(o); saveCfg(); } } catch (e) {} try { history.replaceState(null, "", location.pathname); } catch (e) {} })();
const fbLink = () => location.origin + location.pathname + "#fb=" + btoa(unescape(encodeURIComponent(cfg.firebase))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* ============ 저장소: 로그인 전엔 이 기기, 로그인하면 Firebase ============ */
const DATA_K = "gqw.data";
let S = { cards: [], days: {}, settings: { quotaCards: 15 } };
let user = null, fb = null, fdb = null, saveState = "", authErr = "";
function localLoad() { const o = lsGet(DATA_K, {}); S.cards = Object.values(o.cards || {}); S.days = o.days || {}; S.settings = Object.assign({ quotaCards: 15 }, o.settings || {}); }
function localSaveAll() { const cards = {}; S.cards.forEach(c => cards[c.id] = c); lsSet(DATA_K, { cards, days: S.days, settings: S.settings }); }
const clean = o => JSON.parse(JSON.stringify(o));
const uref = () => fdb.collection("users").doc(user.uid);
function cloudPut(kind, id, data) {
  localSaveAll();
  if (!user || !fdb) { saveState = "local"; return; }
  saveState = "saving";
  const ref = kind === "card" ? uref().collection("cards").doc(id) : kind === "day" ? uref().collection("days").doc(id) : uref();
  pending++; refreshEnv();
  withTO(ref.set(clean(data)), 20000).then(() => { pending--; saveState = "saved"; refreshEnv(); if (!run && tab === "home") render(); }).catch(e => { pending--; saveState = "failed"; cloudStat = "⚠ 마지막 저장 실패: " + ((e && (e.code || e.message)) || e); refreshEnv(); if (!run && (tab === "home" || tab === "settings")) render(); });
}
const withTO = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "시간 초과(서버 응답 없음)" }), ms))]);
let cloudStat = "", cloudCount = null, pending = 0;
/* 계정 저장 시험: 실제로 한 번 쓰고 다시 읽어 본다 */
async function cloudCheck() {
  if (!user || !fdb) return;
  cloudStat = "⏳ 계정 저장 시험 중…"; refreshEnv(); if (tab === "settings") render();
  try {
    await withTO(uref().set({ lastSeen: new Date().toISOString(), settings: S.settings }, { merge: true }), 12000);
    const cs = await withTO(uref().collection("cards").get(), 12000); cloudCount = cs.size;
    cloudStat = "✅ 계정 저장 확인됨 · 계정 카드 " + cloudCount + "장";
    if (cloudCount < S.cards.length) { S.cards.forEach(c => cloudPut("card", c.id, c)); cloudStat += " → 이 기기 카드 " + S.cards.length + "장을 계정에 올리는 중"; }
  } catch (e) { cloudStat = "⚠ 계정 저장 안 됨: " + ((e && (e.code || e.message)) || e); }
  refreshEnv(); render();
}
const keyRef = () => uref().collection("private").doc("keys");
async function syncKey() {
  if (!user || !fdb) return;
  try {
    const d = await withTO(keyRef().get(), 12000), k = d.exists ? d.data() : {};
    if (!cfg.geminiKey && k.geminiKey) { cfg.geminiKey = k.geminiKey; if (k.model) cfg.model = k.model; saveCfg(); }
    else if (cfg.geminiKey && cfg.geminiKey !== k.geminiKey) await withTO(keyRef().set({ geminiKey: cfg.geminiKey, model: cfg.model, updated: today() }), 12000);
  } catch (e) {}
  refreshEnv(); if (tab === "settings") render();
}
async function cloudLoad() {
  const [u, cs, ds] = await Promise.all([uref().get(), uref().collection("cards").get(), uref().collection("days").get()]);
  const cloudCards = cs.docs.map(d => d.data()), cloudDays = {}; ds.docs.forEach(d => cloudDays[d.id] = d.data());
  // 이 기기에만 있던 기록을 계정으로 올린다(같은 카드면 기록이 더 많은 쪽)
  const byId = {}; cloudCards.forEach(c => byId[c.id] = c);
  const up = [];
  S.cards.forEach(c => { const k = byId[c.id]; if (!k || (c.history || []).length > (k.history || []).length) { byId[c.id] = Object.assign({}, k || {}, c); up.push(byId[c.id]); } });
  Object.keys(S.days).forEach(d => { const a = S.days[d], b = cloudDays[d]; if (!b || (a.cardsDone || 0) > (b.cardsDone || 0)) { cloudDays[d] = a; up.push({ __day: d, v: a }); } });
  S.cards = Object.values(byId); S.days = cloudDays;
  if (u.exists && u.data().settings) S.settings = Object.assign({ quotaCards: 15 }, u.data().settings);
  localSaveAll();
  up.forEach(x => x.__day ? cloudPut("day", x.__day, x.v) : cloudPut("card", x.id, x));
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); }); }
async function initFirebase() {
  if (!cfg.firebase) return;
  let conf; try { conf = typeof cfg.firebase === "string" ? JSON.parse(cfg.firebase) : cfg.firebase; } catch (e) { authErr = "Firebase 설정값이 JSON 모양이 아니에요."; return; }
  try {
    const V = "10.12.2", B = "https://www.gstatic.com/firebasejs/" + V + "/";
    await loadScript(B + "firebase-app-compat.js"); await loadScript(B + "firebase-auth-compat.js"); await loadScript(B + "firebase-firestore-compat.js");
    fb = window.firebase; if (!fb.apps.length) fb.initializeApp(conf);
    fdb = fb.firestore(); try { fdb.settings({ experimentalForceLongPolling: true, merge: true }); } catch (e) {}
    try { await fb.auth().getRedirectResult(); } catch (e) { authErr = authText(e); }
    fb.auth().onAuthStateChanged(async u => {
      user = u || null;
      if (user) { try { await withTO(cloudLoad(), 15000); saveState = "saved"; } catch (e) { authErr = "계정 기록을 불러오지 못했어요: " + ((e && (e.code || e.message)) || e); } cloudCheck(); syncKey(); }
      refreshEnv(); renderHeader(); render();
    });
  } catch (e) { authErr = "Firebase를 불러오지 못했어요(인터넷·설정값 확인)."; }
}
const authText = e => ({ "auth/popup-blocked": "팝업이 막혔어요. 다시 누르거나 이메일로 로그인하세요.", "auth/unauthorized-domain": "Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 jsh020605.github.io를 넣어 주세요.", "auth/invalid-credential": "이메일 또는 비밀번호가 틀렸어요.", "auth/wrong-password": "비밀번호가 틀렸어요.", "auth/user-not-found": "없는 계정이에요. 「처음이면 가입」을 누르세요.", "auth/email-already-in-use": "이미 가입된 이메일이에요. 로그인을 누르세요.", "auth/weak-password": "비밀번호는 6자 이상이어야 해요.", "auth/operation-not-allowed": "Firebase 콘솔에서 이 로그인 방법을 켜 주세요.", "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "붙여 넣은 Firebase 설정값의 apiKey가 틀렸어요(한 글자라도 다르면 안 돼요). 아래 「Firebase 설정값 바꾸기 → 연결 끊기」 후 맥에서 복사한 값을 그대로 다시 붙여 넣어 주세요.", "auth/invalid-api-key": "붙여 넣은 Firebase 설정값의 apiKey가 틀렸어요. 연결을 끊고 다시 붙여 넣어 주세요." })[e && e.code] || ("로그인 오류: " + ((e && (e.code || e.message)) || "알 수 없음"));
async function signInGoogle() {
  if (!fb) return; authErr = "";
  const p = new fb.auth.GoogleAuthProvider();
  try { await fb.auth().signInWithPopup(p); }
  catch (e) { if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { try { await fb.auth().signInWithRedirect(p); } catch (x) { authErr = authText(x); } } else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") authErr = authText(e); render(); }
}
async function signInEmail(create) {
  if (!fb) return; authErr = "";
  const em = ($("#em") || {}).value || "", pw = ($("#pw") || {}).value || "";
  try { if (create) await fb.auth().createUserWithEmailAndPassword(em.trim(), pw); else await fb.auth().signInWithEmailAndPassword(em.trim(), pw); }
  catch (e) { authErr = authText(e); render(); }
}

/* ============ 하루 기록·할당량 ============ */
const dayOf = d => Object.assign({ cardsDone: 0, reviewDone: 0, met: false }, S.days[d] || {});
const isMet = d => dayOf(d).cardsDone >= S.settings.quotaCards;
function setDay(d, patch) { const x = Object.assign(dayOf(d), patch); x.met = x.cardsDone >= S.settings.quotaCards; S.days[d] = x; cloudPut("day", d, x); }
function streak() { let n = 0, d = today(); if (!isMet(d)) d = addDays(d, -1); while (S.days[d] && S.days[d].met) { n++; d = addDays(d, -1); } return n; }
const due = () => S.cards.filter(c => (c.nextReview || "0") <= today()).sort((a, b) => String(a.nextReview || "").localeCompare(String(b.nextReview || "")));
const todayStudy = () => { const t0 = today(); return S.cards.map(c => ({ c, h: (c.history || []).filter(x => x.date === t0).slice(-1)[0] })).filter(x => x.h); };

/* ============ Gemini ============ */
async function gemini(prompt, timeoutMs = 45000) {
  if (window.__fakeGemini) return window.__fakeGemini(prompt);
  if (!cfg.geminiKey) throw { code: "nokey" };
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(cfg.model || "gemini-2.5-flash") + ":generateContent", {
      method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json", "x-goog-api-key": cfg.geminiKey },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.3 } })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 429 ? "rate" : r.status === 404 ? "model" : (r.status === 400 || r.status === 403) ? "key" : "http", msg: (j.error && j.error.message) || r.status };
    const txt = ((j.candidates || [])[0] || {}).content ? j.candidates[0].content.parts.map(p => p.text || "").join("") : "";
    return JSON.parse(txt.replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, ""));
  } catch (e) { if (e && e.name === "AbortError") throw { code: "timeout" }; if (e instanceof SyntaxError) throw { code: "json" }; throw e; }

    missed: g ? asArr(g.missing).map(m => typeof m === "object" ? { point: String(m.point || ""), explain: String(m.explain || "") } : { point: String(m), explain: "" }).filter(x => x.point) : [],
    wrongSaid: g ? asArr(g.wrong).map(w => typeof w === "object" ? { said: String(w.said || ""), fix: String(w.fix || "") } : { said: String(w), fix: "" }).filter(x => x.said || x.fix) : []

/* 퀴즈를 채점하는 순간 완료로 기록, 설명 채점·끝내기 때 같은 기록을 고친다(중간에 나가도 남는다) */
function recordCard() {
  const c = run.card, e = buildEntry(), [ok, tot] = e.quiz.split("/").map(Number), pass = ok === tot && (e.explain == null || e.explain >= 70);
  const hist = asArr(c.history).slice(-19);
  if (run.histIdx != null && hist[run.histIdx] && hist[run.histIdx].date === e.date) hist[run.histIdx] = e;
  else { const again = hist.some(r => r && r.date === e.date); hist.push(e); run.histIdx = hist.length - 1; if (!again && !run.counted) { run.counted = true; setDay(e.date, { cardsDone: dayOf(e.date).cardsDone + 1 }); } }

  c.box = pass ? Math.min(run.box0 + 1, INTERVALS.length) : 0;
  c.nextReview = addDays(e.date, pass ? INTERVALS[Math.max(0, c.box - 1)] : 1);

}
function finishCard() { try { recordCard(); } catch (e) {} stopVoice(); run = null; tab = "home"; renderHeader(); setTab("home"); }

function reviewPool() {

}

async function importCards() {

  raw = raw.replace(/```(?:json)?/gi, "").replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
  try { j = JSON.parse(raw); } catch (e) {
    const a = raw.indexOf("{"), b = raw.lastIndexOf("}"), c = raw.indexOf("["), d = raw.lastIndexOf("]");
    try { j = JSON.parse(raw.slice(a, b + 1)); } catch (x) { try { j = JSON.parse(raw.slice(c, d + 1)); } catch (y) { msg.textContent = "카드 모양(JSON)을 읽지 못했어요. Gemini 답의 마지막 코드 블록만 복사해 주세요."; return; } }
  }

}

  if (a === "importCards") return importCards();
  if (a === "saveQuota") { S.settings.quotaCards = Math.max(1, Math.min(60, parseInt($("#quota").value, 10) || 15)); cloudPut("user", "", { settings: S.settings }); renderHeader(); return render(); }
  if (a === "exportAll") { const blob = new Blob([JSON.stringify({ exported: today(), cards: S.cards, days: S.days }, null, 1)], { type: "application/json" }); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = "국시퀘스트_기록_" + today() + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); return; }
});

/* ============ 시작 ============ */
localLoad(); renderHeader(); render(); refreshEnv();
initFirebase().then(() => { refreshEnv(); render(); });
if (window.speechSynthesis) speechSynthesis.getVoices();
</script>
